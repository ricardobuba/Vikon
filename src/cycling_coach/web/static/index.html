<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Vikon</title>
  <link rel="icon" href="/static/favicon.ico?v=27" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" href="/static/icon-192.png?v=27" sizes="192x192" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <meta name="theme-color" content="#2F5BFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vikon" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=27" />
  <!-- Sistema de diseño v2. Las tipografías se sirven desde /static/fonts:
       ninguna petición sale hacia Google al abrir la app. -->
  <link rel="stylesheet" href="/static/tokens.css?v=27" />
  <link rel="stylesheet" href="/static/base.css?v=27" />
</head>
<body>
  <div class="app">
    <header class="vk-header">
      <div class="vk-mark">VIK<i>O</i>N</div>
      <div class="vk-header-meta" id="today"></div>
      <button id="gear" class="vk-icon-btn" title="Ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 7.5h9M17 7.5h3.5M3.5 16.5h3M11 16.5h9.5"/><circle cx="14.5" cy="7.5" r="2.1"/><circle cx="7.5" cy="16.5" r="2.1"/></svg>
      </button>
    </header>

    <main class="vk-main" id="main">
      <!-- HOY -->
      <section id="home-view">
        <div id="home-content"></div>
      </section>

      <!-- PLAN (horizonte de 7 días) -->
      <section id="horizon-view" hidden>
        <div id="horizon-content"></div>
      </section>

      <!-- SESIONES -->
      <section id="activities-view" hidden>
        <div id="activities-content"></div>
      </section>

      <!-- DATOS -->
      <section id="progress-view" hidden>
        <div id="progress-content"></div>
      </section>

      <!-- VIKON (chat) -->
      <section id="chat-view" hidden>
        <!-- Aviso de IA: art. 50 del Reglamento (UE) 2024/1689, exigible desde
             el 2-08-2026. Las Guidelines de la Comisión interpretan de forma
             restrictiva la excepción de "es obvio": que el usuario ya lo sepa
             NO exime, y enterrarlo en los términos no vale. -->
        <div class="vk-ai-notice" role="note">
          Hablas con un asistente de <strong>IA</strong>. El motor decide el
          entrenamiento; la IA solo lo explica y puede equivocarse.
        </div>
        <div class="vk-log" id="chat-log">
          <div class="vk-msg vk-msg--bot">¡Hola! Soy Vikon. Pregúntame qué toca hoy, dime cuánto tiempo tienes, cómo te encuentras, o registra tu peso y sueño.</div>
        </div>
        <div class="vk-chips" id="quick">
          <button class="vk-chip vk-chip--accent" data-q="¿Qué hago hoy?">¿Qué hago hoy?</button>
          <button class="vk-chip" data-q="¿Cómo voy de forma?">¿Cómo voy?</button>
          <button class="vk-chip" data-q="Hoy me siento cansado">Cansado</button>
          <button class="vk-chip" data-q="" data-log="1">Registrar</button>
        </div>
        <div class="chatbar" id="chat-input">
          <input class="vk-input" id="chat-text" placeholder="Escribe a Vikon…" autocomplete="off" />
          <button class="vk-btn" id="chat-send" aria-label="Enviar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 20 4l-8 16-2.2-6.2z"/></svg>
          </button>
        </div>
      </section>

      <!-- AJUSTES -->
      <section id="settings-view" hidden>
        <div id="settings-content"></div>
      </section>
    </main>

    <nav class="vk-nav" id="nav">
      <button data-view="home" class="is-active">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.8 12 3.5l9 7.3"/><path d="M5.5 9.5V20h13V9.5"/></svg>Hoy</button>
      <button data-view="horizon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2.2"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4"/></svg>Plan</button>
      <button data-view="activities">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16.5" r="3.6"/><circle cx="18.5" cy="16.5" r="3.6"/><path d="M12 16.5 9.2 9.6 15.4 8.2 12 16.5M12 16.5H5.5M15.4 8.2 18.5 16.5"/></svg>Sesiones</button>
      <button data-view="progress">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4.5M19 20v-6.5"/></svg>Datos</button>
      <button data-view="chat">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5a2 2 0 0 1-2 2H8l-4 3.5V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>Vikon</button>
    </nav>
  </div>

  <div id="auth" class="overlay"><div class="app"><main class="vk-main" id="auth-card"></main></div></div>
  <div id="onboarding" class="overlay"><div class="app"><main class="vk-main" id="ob-card"></main></div></div>

  <script src="/static/app.js?v=27"></script>
</body>
</html>
